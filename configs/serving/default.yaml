# Settings for `python -m src.serving.api`; override any key with key=value arguments.
host: 0.0.0.0
port: 8000
# Written by `python -m src.registry.fetch --deployment shadow --output models/shadow`.
model_directory: models/shadow
# Only "shadow" is supported: verdicts are returned with action "log_only" and must not block.
mode: shadow
# Matches the PromptRecord text limit used for training data.
max_prompt_characters: 10000
# The bearer token is read from this environment variable. Set require_auth=false only for
# local development.
require_auth: true
auth_token_env: GUARDRAIL_API_TOKEN
