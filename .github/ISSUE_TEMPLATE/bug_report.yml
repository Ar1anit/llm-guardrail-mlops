name: Bug report
description: Report a reproducible defect that is not a security vulnerability
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or sensitive data here. Use the Security tab.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal, safe steps and sanitized inputs.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or revision
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and relevant dependency versions.
    validations:
      required: true

