name: Model release

# Push a tag model-vMAJOR.MINOR.PATCH on a commit of main to publish that registry release:
# a private GHCR image holding exactly that model version, with build provenance, and a public
# GitHub Release carrying the model card, benchmark report, and checksums (never the weights).
# Actions are pinned to commit SHAs because this job can push packages and get Azure tokens.

on:
  push:
    tags:
      - "model-v*.*.*"

permissions: {}

concurrency:
  group: model-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Azure trusts only this environment (federated credential subject), and the environment
    # accepts only model-v* tags.
    environment: model-release
    outputs:
      version: ${{ steps.tag.outputs.version }}
    permissions:
      contents: write # Create the GitHub Release.
      packages: write # Push the image to GHCR.
      id-token: write # Azure OIDC sign-in and the build attestation.
      attestations: write # Store the build provenance attestation.
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep the token out of .git/config; later steps authenticate explicitly.
          persist-credentials: false

      - name: Validate the tag
        id: tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#model-v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not model-vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "image=ghcr.io/$owner/guardrail-classifier"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.28"
          # No dependency cache: other workflows can write it, and this job publishes.
          enable-cache: false
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --extra serving --extra mlops

      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch and verify the release from the model registry
        env:
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: >-
          uv run python -m src.registry.fetch --release "$VERSION"
          --output models/serving --evidence release-evidence

      - name: Read the model identity
        id: model
        run: |
          {
            echo "sha256=$(jq -r .model_sha256 models/serving/release.json)"
            echo "registry_version=$(jq -r .registry_version models/serving/release.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to push into a package that is not private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.tag.outputs.owner }}
        run: |
          # A package created by its first push inherits the public repository's visibility,
          # so the first release still relies on the check after the push.
          if visibility="$(gh api "/users/$OWNER/packages/container/guardrail-classifier" --jq .visibility 2>/dev/null)"; then
            if [[ "$visibility" != "private" ]]; then
              echo "::error::The GHCR package is $visibility; make it private before releasing."
              exit 1
            fi
          else
            echo "::warning::The GHCR package does not exist yet; its first push may be public."
          fi

      - name: Build and push the serving image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # One plain image manifest; provenance is attested by the next step instead.
          provenance: false
          sbom: false
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.title=guardrail-classifier
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.description=Shadow-mode prompt-injection and jailbreak classifier
            io.github.llm-guardrail.model.sha256=${{ steps.model.outputs.sha256 }}
            io.github.llm-guardrail.model.registry-version=${{ steps.model.outputs.registry_version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Require the image to stay private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ steps.tag.outputs.owner }}
        run: |
          visibility="$(gh api "/users/$OWNER/packages/container/guardrail-classifier" --jq .visibility)"
          if [[ "$visibility" != "private" ]]; then
            echo "::error::The GHCR package is $visibility; the image contains the model weights."
            exit 1
          fi

      - name: Assemble release notes and assets
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir release-assets
          cp release-evidence/docs/*.md release-assets/model-card.md
          cp release-evidence/evaluation/*.json release-assets/benchmark-report.json
          cp models/serving/release.json release-assets/release.json
          cp models/serving/export/manifest.json release-assets/manifest.json
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          {
            echo "Container image (private): \`$IMAGE:$VERSION@$DIGEST\`"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' models/serving/release.json
            echo
            echo "The model weights are not attached: a public copy would let anyone search"
            echo "offline for prompts the guardrail misses. Verify the image provenance with"
            echo "\`gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY\`."
            echo
            echo "---"
            echo
            cat release-assets/model-card.md
          } > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --title "guardrail-classifier $VERSION"
          --notes-file release-notes.md
          --verify-tag

  deploy:
    name: Deploy to production-shadow
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: read
